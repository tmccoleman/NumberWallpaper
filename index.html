<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .controls-panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
            flex-shrink: 0;
        }
        .preview-panel {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2, h3 { margin-top: 0; color: #ffffff; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="color"] {
            height: 40px;
            padding: 4px;
            cursor: pointer;
        }
        input[type="file"] {
            font-size: 12px;
            padding: 4px;
            cursor: pointer;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .three-panel-display {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }
        .mockup-box {
            text-align: center;
            flex: 1;
            background: #121212;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .mockup-box span {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-bottom: 8px;
        }
        .mockup-box img {
            width: 100%;
            height: 240px;
            object-fit: contain;
            border-radius: 4px;
            background: transparent;
            display: none;
        }
        .mockup-placeholder {
            width: 100%;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #444;
            border-radius: 4px;
            color: #666;
            font-size: 12px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
        .download-btn:hover { background: #218838; }
        .error { color: #ff6b6b; font-size: 14px; margin-bottom: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Controls Sidebar -->
    <div class="controls-panel">
        <h2>Configuration</h2>
        <div id="error-msg" class="error"></div>
        
        <form id="generator-form" onsubmit="return false;">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" required placeholder="(555) 123-4567" value="5551234567">

            <label for="design">Select Design:</label>
            <select id="design" required>
                <option value="" disabled selected>Loading designs...</option>
            </select>

            <label for="frame">Select Frame Box:</label>
            <select id="frame">
                <option value="">None</option>
            </select>

            <label for="font-family">Font Family:</label>
            <select id="font-family">
                <option value="Arial">Arial</option>
                <option value="Impact">Impact</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
                <option value="Trebuchet MS">Trebuchet MS</option>
            </select>

            <div class="slider-group">
                <label for="font-size">Font Size: <span id="val-fontsize">73</span>px</label>
                <input type="range" id="font-size" min="12" max="100" value="73">
            </div>

            <label for="text-color">Text Color:</label>
            <input type="color" id="text-color" value="#FFFFFF">

            <div class="slider-group">
                <label for="pos-y">Vertical Position (Y): <span id="val-y">2150</span>px</label>
                <input type="range" id="pos-y" min="0" max="2400" value="2150">
            </div>
        </form>
    </div>

    <!-- 3-Panel Preview Display -->
    <div class="preview-panel">
        <h3>Preview Display</h3>
        
        <div class="three-panel-display">
            <!-- Left Reference Upload -->
            <div class="mockup-box">
                <span>Reference Shot 1</span>
                <input type="file" id="upload-left" accept="image/*">
                <div id="placeholder-left" class="mockup-placeholder">No Image Uploaded</div>
                <img id="preview-left" alt="Reference Left">
            </div>

            <!-- Center Custom Preview -->
            <div class="mockup-box" style="border-color: #007BFF;">
                <span style="color: #007BFF; font-weight: bold;">Custom Output Preview</span>
                <div style="height: 28px;"></div> <!-- Spacer to match layout height of file inputs -->
                <img id="center-preview" alt="Center Preview" style="display: block;">
            </div>

            <!-- Right Reference Upload -->
            <div class="mockup-box">
                <span>Reference Shot 2</span>
                <input type="file" id="upload-right" accept="image/*">
                <div id="placeholder-right" class="mockup-placeholder">No Image Uploaded</div>
                <img id="preview-right" alt="Reference Right">
            </div>
        </div>

        <a id="download-link" class="download-btn" download="custom_image.jpg">Download Custom Image</a>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const imageDir = './images/';
    const frameDir = './frames/';
    
    const designSelect = document.getElementById('design');
    const frameSelect = document.getElementById('frame');
    const phoneInput = document.getElementById('phone');
    const fontFamilySelect = document.getElementById('font-family');
    const fontSizeSlider = document.getElementById('font-size');
    const valFontSize = document.getElementById('val-fontsize');
    const textColorInput = document.getElementById('text-color');
    const posYSlider = document.getElementById('pos-y');
    const valY = document.getElementById('val-y');
    
    const centerPreviewImg = document.getElementById('center-preview');
    const downloadLink = document.getElementById('download-link');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Reference upload elements
    const uploadLeft = document.getElementById('upload-left');
    const previewLeft = document.getElementById('preview-left');
    const placeholderLeft = document.getElementById('placeholder-left');

    const uploadRight = document.getElementById('upload-right');
    const previewRight = document.getElementById('preview-right');
    const placeholderRight = document.getElementById('placeholder-right');

    let availableDesigns = [];
    let availableFrames = [];

    async function loadAssets() {
        availableDesigns = ['design_1.jpg', 'design_2.jpg'];
        availableFrames = ['frame_box.png', 'banner.png'];

        try {
            const desRes = await fetch(imageDir + 'manifest.json');
            if (desRes.ok) availableDesigns = await desRes.json();
        } catch (e) {
            console.warn("Using fallback design list.");
        }

        try {
            const frmRes = await fetch(frameDir + 'manifest.json');
            if (frmRes.ok) availableFrames = await frmRes.json();
        } catch (e) {
            console.warn("Using fallback frame list.");
        }

        designSelect.innerHTML = '<option value="" disabled selected>Select a design</option>';
        availableDesigns.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            designSelect.appendChild(opt);
        });
        if (availableDesigns.length > 0) designSelect.value = availableDesigns[0];

        frameSelect.innerHTML = '<option value="">None</option>';
        availableFrames.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            frameSelect.appendChild(opt);
        });
        
        updateCanvas();
    }

    function sanitizePhone(input) {
        const digits = input.replace(/\D/g, '');
        if (digits.length === 11 && digits.startsWith('1')) return digits.slice(1);
        return digits.length === 10 ? digits : null;
    }

    function updateCanvas() {
        const selectedDesign = designSelect.value;
        const selectedFrame = frameSelect.value;
        const rawPhone = phoneInput.value;
        const phone = sanitizePhone(rawPhone) || rawPhone;

        if (!selectedDesign) return;

        valY.textContent = posYSlider.value;
        valFontSize.textContent = fontSizeSlider.value;

        const baseImg = new Image();
        baseImg.src = imageDir + selectedDesign;

        baseImg.onload = function() {
            canvas.width = baseImg.width;
            canvas.height = baseImg.height;

            posYSlider.max = baseImg.height - 50;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(baseImg, 0, 0);

            let posY = parseInt(posYSlider.value);

            if (selectedFrame) {
                const frameImg = new Image();
                frameImg.src = frameDir + selectedFrame;
                frameImg.onload = function() {
                    const frameX = (canvas.width - frameImg.width) / 2;
                    ctx.drawImage(frameImg, frameX, posY);
                    
                    drawCenteredTextAndRender(phone, frameX, posY, frameImg.width, frameImg.height);
                };
                frameImg.onerror = function() {
                    drawDefaultCenteredTextAndRender(phone, posY);
                };
            } else {
                drawDefaultCenteredTextAndRender(phone, posY);
            }
        };
    }

    function drawCenteredTextAndRender(phone, boxX, boxY, boxWidth, boxHeight) {
        const fontSize = parseInt(fontSizeSlider.value);
        const fontFamily = fontFamilySelect.value;
        const textColor = textColorInput.value;

        ctx.font = `bold ${fontSize}px ${fontFamily}`;
        ctx.fillStyle = textColor;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 4;
        
        const textMetrics = ctx.measureText(phone);
        const textWidth = textMetrics.width;

        const textX = boxX + (boxWidth - textWidth) / 2;
        const textY = boxY + (boxHeight / 2) + (fontSize / 3);

        ctx.fillText(phone, textX, textY);

        finalizeRender(phone);
    }

    function drawDefaultCenteredTextAndRender(phone, y) {
        const fontSize = parseInt(fontSizeSlider.value);
        const fontFamily = fontFamilySelect.value;
        const textColor = textColorInput.value;

        ctx.font = `bold ${fontSize}px ${fontFamily}`;
        ctx.fillStyle = textColor;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 4;
        
        const textMetrics = ctx.measureText(phone);
        const textWidth = textMetrics.width;

        const textX = (canvas.width - textWidth) / 2;
        const textY = y + fontSize;

        ctx.fillText(phone, textX, textY);

        finalizeRender(phone);
    }

    function finalizeRender(phone) {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        centerPreviewImg.src = dataUrl;
        downloadLink.href = dataUrl;
        downloadLink.download = `${phone || 'custom'}_output.jpg`;
    }

    // Handle File Uploads for Side Reference Mockups
    function setupImageUpload(inputElement, previewElement, placeholderElement) {
        inputElement.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewElement.src = event.target.result;
                    previewElement.style.display = 'block';
                    placeholderElement.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });
    }

    setupImageUpload(uploadLeft, previewLeft, placeholderLeft);
    setupImageUpload(uploadRight, previewRight, placeholderRight);

    designSelect.addEventListener('change', updateCanvas);
    frameSelect.addEventListener('change', updateCanvas);
    phoneInput.addEventListener('input', updateCanvas);
    fontFamilySelect.addEventListener('change', updateCanvas);
    fontSizeSlider.addEventListener('input', updateCanvas);
    textColorInput.addEventListener('input', updateCanvas);
    posYSlider.addEventListener('input', updateCanvas);

    loadAssets();
</script>

</body>
</html>
