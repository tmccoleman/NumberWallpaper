<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-container {
            display: flex;
            gap: 12px;
            max-width: 950px;
            width: 100%;
            height: calc(100vh - 16px);
            box-sizing: border-box;
        }
        .controls-panel {
            background: #1e1e1e;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            max-height: 100%;
        }
        .preview-panel {
            background: #1e1e1e;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
            min-height: 0;
        }
        h2 { font-size: 15px; margin: 0 0 6px 0; color: #ffffff; }
        h3 { font-size: 13px; margin: 0 0 4px 0; color: #ffffff; flex-shrink: 0; }
        label { display: block; margin-bottom: 2px; font-weight: bold; font-size: 11px; }
        input, select {
            width: 100%;
            padding: 4px 6px;
            margin-bottom: 6px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 11px;
        }
        input[type="color"] {
            height: 26px;
            padding: 2px;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn-custom {
            display: block;
            width: 100%;
            padding: 5px 8px;
            background: #007BFF;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 11px;
            margin-bottom: 6px;
        }
        .upload-btn-custom:hover { background: #0056b3; }
        .slider-group {
            margin-bottom: 6px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin: 0;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        .preview-toggle {
            background: #2d2d2d;
            border: 1px solid #555;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
        .preview-toggle:hover { background: #3d3d3d; }
        .preview-box {
            text-align: center;
            width: 100%;
            background: #121212;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #007BFF;
            margin-bottom: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            min-height: 0;
            overflow: hidden;
        }
        .preview-box span {
            font-size: 10px;
            color: #007BFF;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            flex-shrink: 0;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 140px);
            object-fit: contain;
            border-radius: 4px;
            background: transparent;
            display: block;
        }
        .download-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            font-size: 12px;
            flex-shrink: 0;
        }
        .download-btn:hover { background: #218838; }
        .error { color: #ff6b6b; font-size: 11px; margin-bottom: 4px; }
        canvas { display: none; }

        /* Mobile Responsive Breakpoint */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow: auto;
            }
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .controls-panel {
                width: 100%;
                max-height: none;
            }
            .preview-panel {
                height: 500px;
            }
            .preview-box img {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Controls Sidebar -->
    <div class="controls-panel">
        <div>
            <h2>Configuration</h2>
            <div id="error-msg" class="error"></div>
            
            <form id="generator-form" onsubmit="return false;">
                <label for="phone">Phone Number / Text:</label>
                <input type="text" id="phone" required placeholder="(555) 123-4567" value="(555) 123-4567">

                <label for="design">Final Design / Homescreen:</label>
                <select id="design" required>
                    <option value="" disabled selected>Loading designs...</option>
                </select>

                <label>Positioning Reference:</label>
                <label for="reference-upload" class="upload-btn-custom" id="upload-label">📁 Upload Screenshot Ref...</label>
                <input type="file" id="reference-upload" accept="image/*">

                <label for="box-color">Box Background Color:</label>
                <div style="display: flex; gap: 5px; margin-bottom: 6px;">
                    <input type="color" id="box-color" value="#000000" style="flex-grow: 1; margin-bottom: 0;">
                    <button type="button" id="clear-box-color" style="width: auto; padding: 4px 8px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; font-size: 11px;">None</button>
                </div>
                <input type="hidden" id="box-color-enabled" value="true">

                <div class="slider-group">
                    <label for="box-radius">Box Corner Radius: <span id="val-radius">12</span>px</label>
                    <input type="range" id="box-radius" min="0" max="50" value="12">
                </div>

                <label for="font-family">Font Family:</label>
                <select id="font-family">
                    <option value="Arial">Arial</option>
                    <option value="Impact">Impact</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                </select>

                <div class="slider-group">
                    <label for="font-size">Font Size: <span id="val-fontsize">73</span>px</label>
                    <input type="range" id="font-size" min="12" max="250" value="73">
                </div>

                <label for="text-color">Text Color:</label>
                <input type="color" id="text-color" value="#FFFFFF">

                <div class="slider-group">
                    <label for="pos-y">Vertical Position (Y): <span id="val-y">2150</span>px</label>
                    <input type="range" id="pos-y" min="0" max="2400" value="2150">
                </div>
            </form>
        </div>
    </div>

    <!-- Single Preview Display with Toggle -->
    <div class="preview-panel">
        <div class="preview-header">
            <h3 id="preview-title" style="margin: 0;">Final Output Preview</h3>
            <button type="button" id="toggle-view-btn" class="preview-toggle">Switch to: Reference View</button>
        </div>
        
        <div class="preview-box">
            <span id="preview-subtitle">Clean Output Preview</span>
            <img id="active-preview" alt="Preview Display">
        </div>

        <a id="download-link" class="download-btn" download="custom_image.jpg">Download Custom Image</a>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const imageDir = './images/';
    
    const designSelect = document.getElementById('design');
    const referenceUpload = document.getElementById('reference-upload');
    const uploadLabel = document.getElementById('upload-label');
    const phoneInput = document.getElementById('phone');
    const boxColorInput = document.getElementById('box-color');
    const clearBoxColorBtn = document.getElementById('clear-box-color');
    const boxColorEnabledInput = document.getElementById('box-color-enabled');
    const boxRadiusSlider = document.getElementById('box-radius');
    const valRadius = document.getElementById('val-radius');
    const fontFamilySelect = document.getElementById('font-family');
    const fontSizeSlider = document.getElementById('font-size');
    const valFontSize = document.getElementById('val-fontsize');
    const textColorInput = document.getElementById('text-color');
    const posYSlider = document.getElementById('pos-y');
    const valY = document.getElementById('val-y');
    
    const activePreviewImg = document.getElementById('active-preview');
    const previewTitle = document.getElementById('preview-title');
    const previewSubtitle = document.getElementById('preview-subtitle');
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const downloadLink = document.getElementById('download-link');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let availableDesigns = [];
    let presetImages = {};
    let currentReferenceImage = null;
    let currentMode = 'final'; // 'final' or 'reference'

    async function loadAssets() {
        availableDesigns = ['design_1.jpg', 'design_2.jpg'];

        try {
            const desRes = await fetch(imageDir + 'manifest.json');
            if (desRes.ok) availableDesigns = await desRes.json();
        } catch (e) {
            console.warn("Using fallback design list.");
        }

        rebuildDesignDropdown();

        let loadedCount = 0;
        availableDesigns.forEach(name => {
            const img = new Image();
            img.src = imageDir + name;
            img.onload = function() {
                presetImages[name] = img;
                loadedCount++;
                if (loadedCount === 1) {
                    designSelect.value = name;
                    updatePreviews();
                }
            };
        });
    }

    function rebuildDesignDropdown() {
        designSelect.innerHTML = '';
        availableDesigns.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            designSelect.appendChild(opt);
        });
    }

    referenceUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentReferenceImage = img;
                    uploadLabel.textContent = '📁 Change Reference...';
                    posYSlider.max = Math.max(0, currentReferenceImage.height - 50);
                    
                    // Automatically switch to reference view so the user immediately sees what they uploaded
                    currentMode = 'reference';
                    updateToggleUI();
                    updatePreviews();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    toggleViewBtn.addEventListener('click', function() {
        if (!currentReferenceImage && currentMode === 'final') {
            alert("Please upload a screenshot reference first using the 'Upload Screenshot Ref' button.");
            return;
        }
        currentMode = currentMode === 'final' ? 'reference' : 'final';
        updateToggleUI();
        updatePreviews();
    });

    function updateToggleUI() {
        if (currentMode === 'reference') {
            previewTitle.textContent = 'Reference View Preview';
            previewSubtitle.textContent = 'Screenshot Reference (Icons/Widgets)';
            toggleViewBtn.textContent = 'Switch to: Final Output';
        } else {
            previewTitle.textContent = 'Final Output Preview';
            previewSubtitle.textContent = 'Clean Output Preview';
            toggleViewBtn.textContent = 'Switch to: Reference View';
        }
    }

    clearBoxColorBtn.addEventListener('click', function() {
        if (boxColorEnabledInput.value === 'true') {
            boxColorEnabledInput.value = 'false';
            clearBoxColorBtn.style.background = '#5a2323';
            clearBoxColorBtn.textContent = 'Off';
        } else {
            boxColorEnabledInput.value = 'true';
            clearBoxColorBtn.style.background = '#333';
            clearBoxColorBtn.textContent = 'None';
        }
        updatePreviews();
    });

    function updatePreviews() {
        const selectedDesignName = designSelect.value;
        const baseDesignImage = presetImages[selectedDesignName];

        if (!baseDesignImage) return;

        valY.textContent = posYSlider.value;
        valFontSize.textContent = fontSizeSlider.value;
        valRadius.textContent = boxRadiusSlider.value;

        const textValue = phoneInput.value;
        const posY = parseInt(posYSlider.value);
        const fontSize = parseInt(fontSizeSlider.value);
        const fontFamily = fontFamilySelect.value;
        const textColor = textColorInput.value;
        const boxEnabled = boxColorEnabledInput.value === 'true';
        const boxColor = boxColorInput.value;
        const cornerRadius = parseInt(boxRadiusSlider.value);

        // Always update download link based on the clean final design
        canvas.width = baseDesignImage.width;
        canvas.height = baseDesignImage.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(baseDesignImage, 0, 0);
        renderTextAndBox(canvas, ctx, textValue, posY, fontSize, fontFamily, textColor, boxEnabled, boxColor, cornerRadius);
        
        const finalDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        downloadLink.href = finalDataUrl;
        const safeFilename = textValue.replace(/[^a-zA-Z0-9]/g, '_');
        downloadLink.download = `${safeFilename || 'custom'}_output.jpg`;

        // Render whichever mode is currently active on the single preview pane
        let activeImage;
        if (currentMode === 'reference' && currentReferenceImage) {
            activeImage = currentReferenceImage;
            posYSlider.max = Math.max(0, activeImage.height - 50);
        } else {
            currentMode = 'final';
            updateToggleUI();
            activeImage = baseDesignImage;
            posYSlider.max = Math.max(0, activeImage.height - 50);
        }

        canvas.width = activeImage.width;
        canvas.height = activeImage.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(activeImage, 0, 0);

        renderTextAndBox(canvas, ctx, textValue, posY, fontSize, fontFamily, textColor, boxEnabled, boxColor, cornerRadius);

        activePreviewImg.src = canvas.toDataURL('image/jpeg', 0.9);
    }

    function renderTextAndBox(targetCanvas, targetCtx, text, posY, fontSize, fontFamily, textColor, boxEnabled, boxColor, cornerRadius) {
        targetCtx.font = `bold ${fontSize}px ${fontFamily}`;
        const textMetrics = targetCtx.measureText(text);
        const textWidth = textMetrics.width;

        const boxX = 0;
        const boxWidth = targetCanvas.width;
        const paddingY = fontSize * 0.4;
        const boxHeight = fontSize + (paddingY * 2);

        if (boxEnabled) {
            targetCtx.fillStyle = boxColor;
            targetCtx.beginPath();
            if (typeof targetCtx.roundRect === 'function') {
                targetCtx.roundRect(boxX, posY, boxWidth, boxHeight, cornerRadius);
            } else {
                targetCtx.rect(boxX, posY, boxWidth, boxHeight);
            }
            targetCtx.fill();
        }

        targetCtx.fillStyle = textColor;
        targetCtx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        targetCtx.shadowBlur = 4;

        const textX = (targetCanvas.width - textWidth) / 2;
        const textY = posY + paddingY + fontSize * 0.82; 

        targetCtx.fillText(text, textX, textY);
    }

    designSelect.addEventListener('change', updatePreviews);
    phoneInput.addEventListener('input', updatePreviews);
    boxColorInput.addEventListener('input', updatePreviews);
    boxRadiusSlider.addEventListener('input', updatePreviews);
    fontFamilySelect.addEventListener('change', updatePreviews);
    fontSizeSlider.addEventListener('input', updatePreviews);
    textColorInput.addEventListener('input', updatePreviews);
    posYSlider.addEventListener('input', updatePreviews);

    loadAssets();
</script>

</body>
</html>
