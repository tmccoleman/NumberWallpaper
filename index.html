<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .main-container {
            display: flex;
            gap: 12px;
            max-width: 950px;
            width: 100%;
            height: calc(100vh - 16px);
            box-sizing: border-box;
        }
        .controls-panel {
            background: #1e1e1e;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            max-height: 100%;
        }
        .preview-panel {
            background: #1e1e1e;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
            min-height: 0;
        }
        h2 { font-size: 15px; margin: 0 0 6px 0; color: #ffffff; }
        h3 { font-size: 13px; margin: 0 0 4px 0; color: #ffffff; flex-shrink: 0; }
        label { display: block; margin-bottom: 2px; font-weight: bold; font-size: 11px; }
        input, select {
            width: 100%;
            padding: 4px 6px;
            margin-bottom: 6px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 11px;
        }
        input[type="color"] {
            height: 26px;
            padding: 2px;
            cursor: pointer;
        }
        input[type="file"] {
            font-size: 10px;
            padding: 3px;
            cursor: pointer;
        }
        .slider-group {
            margin-bottom: 6px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin: 0;
        }
        .preview-box {
            text-align: center;
            width: 100%;
            background: #121212;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #007BFF;
            margin-bottom: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            min-height: 0;
            overflow: hidden;
        }
        .preview-box span {
            font-size: 10px;
            color: #007BFF;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
            flex-shrink: 0;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            max-height: calc(100vh - 140px);
            object-fit: contain;
            border-radius: 4px;
            background: transparent;
            display: block;
        }
        .download-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            font-size: 12px;
            flex-shrink: 0;
        }
        .download-btn:hover { background: #218838; }
        .error { color: #ff6b6b; font-size: 11px; margin-bottom: 4px; }
        canvas { display: none; }

        /* Mobile Responsive Breakpoint */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow: auto;
            }
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .controls-panel {
                width: 100%;
                max-height: none;
            }
            .preview-panel {
                height: 500px;
            }
            .preview-box img {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- Controls Sidebar -->
    <div class="controls-panel">
        <div>
            <h2>Configuration</h2>
            <div id="error-msg" class="error"></div>
            
            <form id="generator-form" onsubmit="return false;">
                <label for="phone">Phone Number / Text:</label>
                <input type="text" id="phone" required placeholder="(555) 123-4567" value="(555) 123-4567">

                <label for="design">Design / Homescreen:</label>
                <select id="design" required>
                    <option value="" disabled selected>Loading designs...</option>
                    <option value="upload_custom">📁 Upload Custom Snapshot...</option>
                </select>

                <input type="file" id="custom-design-upload" accept="image/*" style="display: none;">

                <label for="box-color">Box Background Color (Leave empty for none):</label>
                <div style="display: flex; gap: 5px; margin-bottom: 6px;">
                    <input type="color" id="box-color" value="#000000" style="flex-grow: 1; margin-bottom: 0;">
                    <button type="button" id="clear-box-color" style="width: auto; padding: 4px 8px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; font-size: 11px;">None</button>
                </div>
                <input type="hidden" id="box-color-enabled" value="true">

                <div class="slider-group">
                    <label for="box-radius">Box Corner Radius: <span id="val-radius">12</span>px</label>
                    <input type="range" id="box-radius" min="0" max="50" value="12">
                </div>

                <label for="font-family">Font Family:</label>
                <select id="font-family">
                    <option value="Arial">Arial</option>
                    <option value="Impact">Impact</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                </select>

                <div class="slider-group">
                    <label for="font-size">Font Size: <span id="val-fontsize">73</span>px</label>
                    <input type="range" id="font-size" min="12" max="250" value="73">
                </div>

                <label for="text-color">Text Color:</label>
                <input type="color" id="text-color" value="#FFFFFF">

                <div class="slider-group">
                    <label for="pos-y">Vertical Position (Y): <span id="val-y">2150</span>px</label>
                    <input type="range" id="pos-y" min="0" max="2400" value="2150">
                </div>
            </form>
        </div>
    </div>

    <!-- Single Preview Display -->
    <div class="preview-panel">
        <h3>Preview Display</h3>
        
        <div class="preview-box">
            <span>Custom Output Preview</span>
            <img id="center-preview" alt="Center Preview">
        </div>

        <a id="download-link" class="download-btn" download="custom_image.jpg">Download Custom Image</a>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const imageDir = './images/';
    
    const designSelect = document.getElementById('design');
    const customDesignUpload = document.getElementById('custom-design-upload');
    const phoneInput = document.getElementById('phone');
    const boxColorInput = document.getElementById('box-color');
    const clearBoxColorBtn = document.getElementById('clear-box-color');
    const boxColorEnabledInput = document.getElementById('box-color-enabled');
    const boxRadiusSlider = document.getElementById('box-radius');
    const valRadius = document.getElementById('val-radius');
    const fontFamilySelect = document.getElementById('font-family');
    const fontSizeSlider = document.getElementById('font-size');
    const valFontSize = document.getElementById('val-fontsize');
    const textColorInput = document.getElementById('text-color');
    const posYSlider = document.getElementById('pos-y');
    const valY = document.getElementById('val-y');
    
    const centerPreviewImg = document.getElementById('center-preview');
    const downloadLink = document.getElementById('download-link');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let availableDesigns = [];
    let currentBaseImage = null;

    async function loadAssets() {
        availableDesigns = ['design_1.jpg', 'design_2.jpg'];

        try {
            const desRes = await fetch(imageDir + 'manifest.json');
            if (desRes.ok) availableDesigns = await desRes.json();
        } catch (e) {
            console.warn("Using fallback design list.");
        }

        rebuildDesignDropdown();
        if (availableDesigns.length > 0) {
            designSelect.value = availableDesigns[0];
            loadPresetDesign(availableDesigns[0]);
        }
    }

    function rebuildDesignDropdown() {
        designSelect.innerHTML = '';
        availableDesigns.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            designSelect.appendChild(opt);
        });

        const uploadOpt = document.createElement('option');
        uploadOpt.value = 'upload_custom';
        uploadOpt.textContent = '📁 Upload Custom Snapshot...';
        designSelect.appendChild(uploadOpt);
    }

    function loadPresetDesign(filename) {
        const img = new Image();
        img.src = imageDir + filename;
        img.onload = function() {
            currentBaseImage = img;
            posYSlider.max = Math.max(0, currentBaseImage.height - 50);
            updateCanvas();
        };
    }

    designSelect.addEventListener('change', function() {
        if (designSelect.value === 'upload_custom') {
            customDesignUpload.click();
        } else {
            loadPresetDesign(designSelect.value);
        }
    });

    customDesignUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentBaseImage = img;
                    posYSlider.max = Math.max(0, currentBaseImage.height - 50);
                    
                    const customOptionVal = 'custom_uploaded_' + file.name;
                    if (![...designSelect.options].some(o => o.value === customOptionVal)) {
                        const opt = document.createElement('option');
                        opt.value = customOptionVal;
                        opt.textContent = 'Custom: ' + file.name;
                        designSelect.insertBefore(opt, designSelect.lastElementChild);
                    }
                    designSelect.value = customOptionVal;
                    updateCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            if (!currentBaseImage && availableDesigns.length > 0) {
                designSelect.value = availableDesigns[0];
                loadPresetDesign(availableDesigns[0]);
            }
        }
    });

    clearBoxColorBtn.addEventListener('click', function() {
        if (boxColorEnabledInput.value === 'true') {
            boxColorEnabledInput.value = 'false';
            clearBoxColorBtn.style.background = '#5a2323';
            clearBoxColorBtn.textContent = 'Off';
        } else {
            boxColorEnabledInput.value = 'true';
            clearBoxColorBtn.style.background = '#333';
            clearBoxColorBtn.textContent = 'None';
        }
        updateCanvas();
    });

    function updateCanvas() {
        if (!currentBaseImage) return;

        const textValue = phoneInput.value;
        valY.textContent = posYSlider.value;
        valFontSize.textContent = fontSizeSlider.value;
        valRadius.textContent = boxRadiusSlider.value;

        canvas.width = currentBaseImage.width;
        canvas.height = currentBaseImage.height;

        posYSlider.max = Math.max(0, currentBaseImage.height - 50);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentBaseImage, 0, 0);

        let posY = parseInt(posYSlider.value);
        const fontSize = parseInt(fontSizeSlider.value);
        const fontFamily = fontFamilySelect.value;
        const textColor = textColorInput.value;
        const boxEnabled = boxColorEnabledInput.value === 'true';
        const boxColor = boxColorInput.value;
        const cornerRadius = parseInt(boxRadiusSlider.value);

        ctx.font = `bold ${fontSize}px ${fontFamily}`;
        const textMetrics = ctx.measureText(textValue);
        const textWidth = textMetrics.width;

        // Make the background box span the full width of the image (X-axis)
        const boxX = 0;
        const boxWidth = canvas.width;
        
        // Vertical padding relative to font size
        const paddingY = fontSize * 0.4;
        const boxHeight = fontSize + (paddingY * 2);

        if (boxEnabled) {
            ctx.fillStyle = boxColor;
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') {
                ctx.roundRect(boxX, posY, boxWidth, boxHeight, cornerRadius);
            } else {
                ctx.rect(boxX, posY, boxWidth, boxHeight);
            }
            ctx.fill();
        }

        ctx.fillStyle = textColor;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 4;

        // Center the text horizontally within the full-width box, and align vertically
        const textX = (canvas.width - textWidth) / 2;
        const textY = posY + paddingY + fontSize * 0.82; 

        ctx.fillText(textValue, textX, textY);

        finalizeRender(textValue);
    }

    function finalizeRender(text) {
        const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
        centerPreviewImg.src = dataUrl;
        downloadLink.href = dataUrl;
        
        const safeFilename = text.replace(/[^a-zA-Z0-9]/g, '_');
        downloadLink.download = `${safeFilename || 'custom'}_output.jpg`;
    }

    phoneInput.addEventListener('input', updateCanvas);
    boxColorInput.addEventListener('input', updateCanvas);
    boxRadiusSlider.addEventListener('input', updateCanvas);
    fontFamilySelect.addEventListener('change', updateCanvas);
    fontSizeSlider.addEventListener('input', updateCanvas);
    textColorInput.addEventListener('input', updateCanvas);
    posYSlider.addEventListener('input', updateCanvas);

    loadAssets();
</script>

</body>
</html>
